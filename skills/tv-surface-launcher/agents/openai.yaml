interface:
  display_name: "TV Surface Launcher"
  short_description: "Fetch TV data, validate presentation JSON, and preview"
  default_prompt: "Use $tv-surface-launcher to fetch data, generate presentation JSON, validate it with tv_presentation_validate, save it, and launch a local TV surface preview. For runtime handoff, assume tv_a2ui_launcher is already installed on the target TV or Tizen environment unless the user says otherwise."
