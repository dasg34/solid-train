interface:
  display_name: "Tizen Tool Presentation Catalog"
  short_description: "Presentation JSON schema and generation rules for Samsung Tizen TV"
  default_prompt: |
    Use this skill to learn how to generate valid presentation JSON for the TV app.
    The app handles final rendering internally.
    Contains output rules, field schema, field selection rules, validation guidance,
    and a strong preference for charts when numeric trend or comparison data exists.
